# live_readers.toml: what tools\check_live_readers.py needs besides the sources.
#
# A setting that is not restart-only promises that a change is seen now. The check looks for a reader that follows it (a LiveText, a change callback, a read per frame
# or per call, a table of names read by a variable). A setting that is read when a FEATURE starts, by nature, is listed here with the reason: it is not a failure.
# One entry per reason; names are setting names.

[[next_use]]
why = "read when a wheel calibration starts (wheel_ffb.cpp StartCalibration): the sign is part of the measurement being made"
names = ["wheel_ffb_sign"]
