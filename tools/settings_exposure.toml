# settings_exposure.toml: what tools\check_settings_exposure.py needs besides the sources (SETTINGS-REVIEW.md, B.1 and 5.7).
#
# A cvar of the game is one of: a row (pause menu, found in the sources; or launcher only, listed here), on the exception list below, or
# `.debug_only()`. Everything else fails the check, so a new cvar is classified when it is written. Names are cvar names, one entry per group.

# Which pause-menu files hold rows. normal_files: the rows are for every player. dynamic_files: files that only exist to build rows; every
# string in them that is a cvar's name counts as written by a row (the upscaling mode row names no cvar in its constructor).
# debug_files / debug_table_pattern: rows of the hidden debug menu (SX-G4); a cvar named there must be `.debug_only()` and not restart-only.
# Paths are relative to src/mc_engine (or to src, when the file is there); since the folder reorganisation (5b9af642) every menu file sits
# in a topic folder. A path that names no file stops the check.
[menus]
normal_files = ["menus/pause_menu.cpp", "menus/upscaling_menu.cpp", "menus/frame_generation_menu.cpp", "camera/camera_look.cpp", "menus/display_menu.cpp"]
dynamic_files = ["menus/upscaling_menu.cpp", "menus/frame_generation_menu.cpp", "menus/display_menu.cpp"]
debug_files = ["menus/debug_menu_pages.cpp"]
debug_table_pattern = "^kDebug"

# The exception list: cvars with no pause-menu or launcher row that are still ordinary settings of the game. They are NOT `.debug_only()`.
[[exception]]
why = "keyboard rebinding: the F4 panel is the only place to rebind a key and the launcher has no key picker"
names = [
  "kb_ui_accept", "kb_ui_back", "kb_ui_x", "kb_ui_y",
  "kb_ui_lb", "kb_ui_rb", "kb_ui_lt", "kb_ui_rt",
  "kb_ui_up", "kb_ui_down", "kb_ui_left", "kb_ui_right",
  "kb_ui_start", "kb_ui_select", "kb_drive_steer_left", "kb_drive_steer_right",
  "kb_drive_gas", "kb_drive_brake", "kb_drive_handbrake", "kb_drive_weight",
  "kb_drive_nitro", "kb_drive_headlights", "kb_drive_horn", "kb_drive_camera",
  "kb_drive_camera_keys", "kb_drive_camera_views", "kb_drive_lookback", "kb_drive_map",
  "kb_drive_talk", "kb_drive_shift_up", "kb_drive_shift_down", "kb_drive_pause",
  "kb_drive_popup_select", "kb_drive_popup_back",
  "extra_button_l4", "extra_button_l5", "extra_button_r4", "extra_button_r5",
]

[[exception]]
why = "keyboard steering feel (KBM-DESIGN.md P5): the ramp's two times are F4-only tunables with documented defaults (0.40 s to full lock, 0.25 s back); the launcher has no row for them. Mouse look itself, its sensitivity and inversions are pause-menu rows (camera_look.cpp) with launcher rows"
names = ["kb_steer_rise", "kb_steer_return"]

[[exception]]
why = "photo album export (photo_export.cpp, 63312657): on by default it turns the dead PUBLISH ALBUM button (the Social Club is closed) into EXPORT ALBUM; the folder is a text path, which no pause-menu row type takes. F4 only, like the online address"
names = ["photo_album_export", "photo_album_export_dir"]

[[exception]]
why = "online choices that have no row and need a text box (settings.cpp offers copy and paste for a server address); SETTINGS-REVIEW.md question 8: stay in F4 for now"
names = [
  "server_browser_servers", "server_browser_show_icons",
  "rmr_enabled", "rmr_server", "rmr_server_port", "leaderboards_enabled",
]

[[exception]]
why = "safety: an emergency stop for a wheel's force (wheel_ffb.cpp)"
names = ["wheel_ffb_panic", "wheel_ffb_rearm"]

[[exception]]
why = "legacy migration: ReadOldSetting writes it back at start and only SaveCvarsToConfig removes the old larecomp.toml line; tagging it would keep an old false line and re-apply it every start"
names = ["adaptive_triggers"]

# Cvars that a launcher row (SettingsSchema.cs) writes and the pause menu has no row for (SETTINGS-REVIEW.md A.2, KEEP). They are not tagged.
# The launcher lives in another repository, so the list is kept here; the catalog check (check_settings_catalog.py) keeps the launcher in step.
[[launcher_row]]
why = "A.2 KEEP rows with no pause-menu row"
names = [
  "mcla_controller_toast",
  "custom_music_announce", "custom_music_announce_seconds", "custom_music_cue_gain_db",
  "larecomp_discord_rpc", "larecomp_discord_rpc_language",
  "mcla_gpu_adapter", "unlock_ride_height", "unlock_wheel_fit",
  "profile_auto_select", "model_mods",
  "online_master_server",
  "wheel_mode", "wheel_ffb", "wheel_ffb_strength", "wheel_ffb_boost", "wheel_ffb_centering", "wheel_ffb_sign",
  "wheel_device_range", "wheel_game_range", "wheel_steer_deadzone",
]

[[launcher_row]]
why = "rexglue 0.11 only: the launcher's Graphics API row (SettingsSchema.cs) writes it, the pause menu has none (a restart setting). On 0.10 it was the SDK's own setting, so this check never saw it; on 0.11 LARecomp declares it (settings/larecomp_app_settings.h) and it is a player setting again (bf515e8c)"
names = ["graphics_backend"]

# SX-G7 gave the pause menu rows for camera_shake_scale, rearview_cars, map_mouse, map_mouse_zoom, map_mouse_hide_cursor,
# map_mouse_magnet, trigger_throttle, trigger_brake and skip_intro, so they left this list: they are rows of both surfaces now.

# World AO uses the existing mcla_gpu_ao player row. Its diagnostics and A/B settings are debug-only
# and live. The live_debug group in live_readers.toml checks those tags and readers as definitions land.

# No [[pending]] list: SX-G5 took every DEBUG and REMOVE row out of the normal pause-menu tables, so a `.debug_only()` cvar that a
# normal row names fails the check outright. (A row that names a key that is not a cvar, like the old RENDERER row, would be a
# [[virtual_row]] entry: `rows` is the constructor's key, `names` the cvars it writes. None is left.)

# gpu.driver (the renderer: larecomp, or d3d12 / vulkan / any for the XENIA renderer) is the SDK's own startup-only setting, so no source of ours
# defines it and the check never lists it: it needs no entry above (a name here that no source defines is only a warning, and it is not an
# exception, a launcher row or a pause-menu row). It has ONE row, on the hidden DEBUG menu: RENDERING > RENDERER (debug_menu_pages.cpp,
# PM_RxDbgRenderer), the way to the XENIA renderer that stays in the program as a fallback (owner, 2026-11-19; gpu/renderer_fallback.h). That row
# breaks the rule of the other debug rows on purpose: it is not live, it HOLDS the choice (pause_menu.cpp kDeferredCvars) and the next save writes
# it to larecomp.toml, and the check does not see it (a dotted name does not match its row pattern). Nothing in the normal pause menus or in
# the launcher offers it. The box that says the native renderer could not start, the shader build's failure dialog and the offer after two
# starts that never got going write the same setting (renderer_fallback.h).
