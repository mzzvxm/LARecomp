[rows.PM_RxWeather]
help = "Force the weather."

[rows.PM_RxCarbonHood]
help = "Choose whether this car uses carbon fiber for its hood."

[rows.PM_RxCarbonTrunk]
help = "Choose whether this car uses carbon fiber for its trunk."

[rows.PM_RxCarbonDoors]
help = "Choose whether this car uses carbon fiber for its doors."

[rows.PM_RxCarbonRoof]
help = "Choose whether this car uses carbon fiber for its roof."

[rows.PM_RxCarbonBumpers]
help = "Choose whether this car uses carbon fiber for its bumpers."

[rows.PM_RxCarbonBody]
help = "Choose whether this car uses carbon fiber for its fenders & skirts."

[rows.PM_RxCarbonSpoiler]
help = "Choose whether this car uses carbon fiber for its spoiler."

[rows.PM_RxCarbonExtras]
help = "Choose whether this car uses carbon fiber for its grill & intercooler."

[rows.PM_RxLanguage]
