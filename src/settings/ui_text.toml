help = "The frame rate cap while frame generation runs, in frames the game RENDERS a second (twice as many are shown): -1 is HALF DISPLAY, the default, the floor of 97% of half of the display's refresh rate (116 at 240 Hz, 58 at 120 Hz), which fills the display; it is only offered on a display of 100 Hz or more, and where it is not the cap you chose (fps_limit) applies."
