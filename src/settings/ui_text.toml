[rows.PM_RxDisplayMode]
native = "kDisplayModeDynamics"
help = "Windowed is a normal window. Borderless fills the screen with a window that has no frame and leaves the display as it is. Fullscreen can also switch the display to the size chosen in Resolution."

[rows.PM_RxResolution]
native = "kResolutionDynamics"
help = "Sets the window size. In exclusive fullscreen, the game uses the selected display mode."

[rows.PM_RxAspect]
help = "Shape of the picture: auto fills the window at any shape (a 21:9 or 32:9 window gets a wider view, a 16:10, 4:3 or taller one more above and below; the HUD stays 16:9 in the middle), or 16:9, 16:10, 21:9 or 32:9 whatever the window is, with black bars above and below where the window is narrower than that shape and at the sides where it is wider."

[rows.PM_RxSubGpuHdr]
help = "Open the hdr settings."

[rows.PM_RxDisplayGamma]
help = "Display gamma ramp."

[rows.PM_RxVsync]
help = "Present on vertical blank."

[rows.PM_RxFpsCap]
native = "kFpsLimitDynamics"
help = "Caps how many frames the game draws a second. Unlimited removes the cap."
value = { "0" = { "title" = "Unlimited" } }

[rows.PM_RxHidePointer]
help = "Hide the mouse pointer during play."

[rows.PM_RxMenuMouse]
help = "Use the mouse to point at and select pause-menu items."

[rows.PM_RxIntroSpeed]
apply_note = "The legal screens and logos play before the settings menu opens."
help = "Present the start-up legal screens and logos 30 times a second, as the console does."

[rows.PM_RxSkipIntro]
help = "Skip the intro videos to prevent graphical issues."

[rows.PM_RxVibration]
help = "Controller vibration."

[rows.PM_RxTrigResist]
help = "DualSense trigger resistance: a throttle spring on R2 and brake resistance on L2 while a car is driven, slack everywhere else."

[rows.PM_RxTrigVibrate]
help = "DualSense trigger vibration: R2 vibrates while the driven wheels spin under power and L2 while the brakes lock the wheels, harder the more they slip."

[rows.PM_RxTrigThrottle]
native = "kTriggerStrengthDynamics"
help = "R2 resistance at the end of its travel, 1 (light) to 8 (firm)."
value = { "1" = { "label" = "1 (LIGHT)" }, "8" = { "label" = "8 (FIRM)" } }

[rows.PM_RxTrigBrake]
native = "kTriggerStrengthDynamics"
help = "L2 resistance at the end of its travel, 1 (light) to 8 (firm)."
value = { "1" = { "label" = "1 (LIGHT)" }, "8" = { "label" = "8 (FIRM)" } }

[rows.PM_RxImpulse]
help = "Xbox One and Xbox Series trigger rumble: the right trigger shakes while the driven wheels spin under power, the left while the brakes lock the wheels, harder the more they slip."

[rows.PM_RxImpulseStr]
help = "How strong the Xbox trigger rumble is, in percent of what the trigger motors can do (10 to 100)."

[rows.PM_RxDeadzoneL]
help = "Dead zone of the left stick, in percent of its range: a stick that rests off centre (drift) reads as centred inside it."

[rows.PM_RxDeadzoneR]
help = "Dead zone of the right stick, in percent of its range: a stick that rests off centre (drift) reads as centred inside it."

[rows.PM_RxButtonLayout]
help = "On-screen button glyphs."

[rows.PM_RxUnspawn]
native = "kTrafficRangeDynamics"
help = "How far from you traffic cars are kept, in metres: a car further away is removed."

[rows.PM_RxPedDensity]
native = "kPedDensityDynamics"
help = "How many people walk the streets, as a multiple of the game's own amount (0 = none, 1 = the game's)."

[rows.PM_RxParkedCars]
native = "kParkedDensityDynamics"
help = "How many cars are parked along the roads, as a multiple of the game's own amount (0 = none, 1 = the game's)."

[rows.PM_RxFragDist]
help = "fragTuneStruct::GlobalMaxDrawingDistance — draw distance for breakable props (poles, signs, fences)."

[rows.PM_RxLodTraffic]
native = "kTrafficLodDynamics"
help = "How far away traffic cars keep their detailed models, as a multiple of the original distance."

[rows.PM_RxLodCity]
native = "kCityLodDynamics"
help = "How far away buildings and other city scenery keep their detail, as a multiple of the original distance."

[rows.PM_RxMsaa]
native = "kMsaaRowDynamics"
help = "MSAA of the images of the screen the game multisamples (M6d.2): off (1 sample), 2 (the console's), 4 or 8 samples on the host."

[rows.PM_RxGpuAa]
native = "kPostAaDynamics"
help = "Anti-aliasing of the composed scene, before the UI (M6c): off, fxaa (FXAA 3.11, Xenia's preset) or smaa (SMAA 1x, preset HIGH)."

[rows.PM_RxGpuAniso]
help = "Anisotropic texture filtering: game (the game's own fetch constants), off, 2, 4, 8 or 16."

[rows.PM_RxXeAniso]
help = "Sharpens textures seen at an angle, such as roads and pavements."

[rows.PM_RxDof]
help = "Disable Depth of Field (DoF) completely."

[rows.PM_RxBlur]
help = "Disable Motion Blur completely."

[rows.PM_RxSharpUi]
help = "Sharper HUD and menu art where the game's bitmaps are blown up (a render scale above 1.25x of the console's 720p picture: 1080p and 4K windows)."

[rows.PM_RxSharpMinimap]
help = "Draw the HUD's and the menus' small views (the minimap, the phone screen, and the page of the pause menu, the garage and the GPS map, which the game always draws at fixed sizes and the screen stretches) at the render scale, as the images of the screen are, so that the minimap and the menus' text come out as sharp as the rest of the picture at 1080p and 4K."

[rows.PM_RxNoShadows]
help = "Draws the game's real-time shadows. Off is the biggest speed-up, and the world loses its cast shadows."

[rows.PM_RxFoliage]
native = "kFoliageDynamics"
help = "Far trees are drawn as flat cards, and each casts a baked shadow silhouette into the sun's shadows."

[rows.PM_RxGpuShadowDetail]
native = "kShadowDetailDynamics"
help = "How sharp the edges of the sun's shadows can get. High draws them twice as big and Ultra three times, which costs a little speed and video memory."

[rows.PM_RxGpuShadowFilter]
native = "kShadowFilterDynamics"
help = "How the sun's shadows are filtered: game (the game's own: four taps at an angle that changes from pixel to pixel, a grainy edge), soft (more taps on a disk, a smooth edge without grain, of the same width as the game's, or narrower on a finer shadow map: SHADOW DETAIL), pcss (soft, with contact hardening: a shadow is sharp where it touches what casts it and softer with the distance from it, as the sun's own shadows are; an integrated graphics card gets soft)."

[rows.PM_RxGpuContact]
native = "kContactDynamics"
help = "Contact shadows: the short sun shadows the game does not draw (under a car's sills, at the foot of a kerb or a wall, under props on the pavement), found from the picture's depth and put only on the sun's light, so they never darken what the game's own shadows already cover."

[rows.PM_RxGpuRtShadows]
native = "kRtShadowsDynamics"
help = "Uses ray tracing to draw the sun’s shadows from buildings and other city geometry."

[rows.PM_RxGpuTrafficShadows]
native = "kTrafficShadowsDynamics"
help = "Traffic and the other AI cars cast into the sun's shadow map like the player's car, so the ground under them is dark (the game only draws the player's car into it)."

[rows.PM_RxGpuCarShadowMap]
native = "kCarShadowDynamics"
help = "Car shadow map: your car casts a shadow of its real shape on itself and on the road beside it."

[rows.PM_RxGpuAo]
native = "kAoDynamics"
help = "Ambient occlusion: darkens creases, kerbs, the ground under cars and where objects meet, from the picture's depth, only on the sky light and not on the sun's (the game's own constants say how much of a surface's light is which). Ray Traced finds it with rays in the city's and the cars' own shapes instead, where the graphics card can."

[rows.PM_RxGpuAoLevel]
native = "kAoIntensityDynamics"
help = "How strong ambient occlusion looks: light, default, strong or max."

[rows.PM_RxGpuSsgi]
native = "kSsgiDynamics"
help = "Bounce light: the light a lit wall or the ground sends back onto the road, the sides of cars and the walls beside it, found from the picture, so a red wall tints the pavement by it and a street lamp's pool lights the wall next to it."

[rows.PM_RxGpuRtGi]
native = "kRtGiDynamics"
help = "Uses rays to light surfaces with light bounced from the city around them."

[rows.PM_RxGpuSsgiLevel]
native = "kSsgiLevelDynamics"
help = "How strong the bounce light looks: light, default, strong, stronger or strongest."

[rows.PM_RxGpuSunShafts]
native = "kShaftsDynamics"
help = "Sun shafts: a low sun behind trees and buildings streams light across the scene, as light through a haze."

[rows.PM_RxGpuHeadlights]
native = "kHeadlightsDynamics"
help = "Lets car headlights illuminate the street, nearby cars, and roadside objects."

[rows.PM_RxGpuLightShadows]
native = "kLightShadowDynamics"
help = "Lets headlights and nearby lights cast shadows."

[rows.PM_RxGpuNeonLight]
native = "kNeonLightDynamics"
help = "Makes cars with neon underglow light the ground beneath them."

[rows.PM_RxGpuVolumetrics]
native = "kVolumetricsDynamics"
help = "Makes light beams from headlights and street lamps visible in the air."

[rows.PM_RxGpuRoadRefl]
native = "kRoadReflectionDynamics"
help = "How sharp the road reflection is: the wet roads, the shop and building windows and the water show a mirror image of the city that the game draws at 256x256 and stretches over the whole screen, which is why it looks soft."

[rows.PM_RxGpuCarRefl]
native = "kCarReflectionDynamics"
help = "How sharp the reflections in the paint, windows and bonnet of the cars are: the game draws the world around the car as a 512x256 picture for them to reflect, which is why the reflections look soft up close."

[rows.PM_RxGpuCarSelfRefl]
native = "kCarSelfReflDynamics"
help = "Your car's paint reflects the car itself. On works from the picture on the screen; Ray Traced from the car's own shape, so a part the camera cannot see shows in the paint too."

[rows.PM_RxGpuRtCityRefl]
native = "kRtCityDynamics"
help = "The car paint reflects the real street, found by rays in the city's own triangles: the building across the road, the lamp posts, signs, the car beside you."

[rows.PM_RxGpuSideMirrors]
help = "The two side mirrors of your car show the street and the cars behind you, taken from the game's own rear view mirror camera. Works on any graphics card; where RT Side Mirrors runs it takes this row's place."

[rows.PM_RxGpuRtMirror]
help = "The two side mirrors show the real view behind, found by rays in the car's own shape: the cars beside you, your own flank and rear, and the sky and street. Shown in the cockpit and bumper cameras."

[rows.PM_RxGpuSsr]
native = "kSsrDynamics"
help = "Adds reflections to wet roads and glossy surfaces using detail from the current picture."

[rows.PM_RxGpuHdr]
help = "HDR output for an HDR10 display."

[rows.PM_RxGpuHdrWhite]
native = "kHdrPaperWhiteDynamics"
help = "How bright the game's white is in HDR, in nits (Windows' own slider covers 80 to 480)."
value = { "0" = { "label" = "AUTO" }, "80" = { "label" = "80 NITS" }, "100" = { "label" = "100 NITS" }, "120" = { "label" = "120 NITS" }, "160" = { "label" = "160 NITS" }, "200" = { "label" = "200 NITS" }, "240" = { "label" = "240 NITS" }, "280" = { "label" = "280 NITS" }, "320" = { "label" = "320 NITS" }, "400" = { "label" = "400 NITS" }, "480" = { "label" = "480 NITS" } }

[rows.PM_RxGpuHdrPeak]
native = "kHdrPeakDynamics"
help = "The brightest level HDR output may reach, in nits (200 to 4000 covers most displays)."
value = { "0" = { "label" = "AUTO" }, "200" = { "label" = "200 NITS" }, "400" = { "label" = "400 NITS" }, "600" = { "label" = "600 NITS" }, "800" = { "label" = "800 NITS" }, "1000" = { "label" = "1000 NITS" }, "1200" = { "label" = "1200 NITS" }, "1500" = { "label" = "1500 NITS" }, "2000" = { "label" = "2000 NITS" }, "3000" = { "label" = "3000 NITS" }, "4000" = { "label" = "4000 NITS" } }

[rows.PM_RxGpuHdrHighlights]
native = "kHdrHighlightDynamics"
help = "HDR output: how far the game's lights, the sun, the sky at dusk and the headlights go above the game's white: 1 normal, 1.5 bright, 2 brighter, 3 brightest."
value = { "1" = { "label" = "NORMAL" }, "1.5" = { "label" = "BRIGHT" }, "2" = { "label" = "BRIGHTER" }, "3" = { "label" = "BRIGHTEST" } }

[rows.PM_RxGpuHdrTest]
native = "kHdrTestDynamics"
help = "In HDR, shows brightness bars instead of the game."
surfaces = ["game"]

[rows.PM_RxGpuReflex]
native = "kLowLatencyDynamics"
help = "The GPU vendor's latency reducer: NVIDIA Reflex on an NVIDIA GPU, AMD Anti-Lag 2 on an AMD one."

[rows.PM_RxGpuAntiLag]
native = "kLowLatencyDynamics"
help = "The GPU vendor's latency reducer: NVIDIA Reflex on an NVIDIA GPU, AMD Anti-Lag 2 on an AMD one."

