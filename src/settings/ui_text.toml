[rows.PM_RxGpuUpsc]
native = "kUpscalerDynamics"
help = "Chooses the technology used to upscale the picture. Off draws it at the selected render scale."

[rows.PM_RxGpuUpscMode]
native = "kModeDynamics"
help = "How small the game draws the 3D scene before it is built back up to the window's size: the share is in brackets."

[rows.PM_RxGpuUpscSharp]
native = "kSharpnessDynamics"
help = "Adjusts edge sharpening when a FidelityFX upscaler is active."

[rows.PM_RxGpuDenoiser]
native = "kDenoiserDynamics"
help = "On uses your GPU's denoiser for supported effects. Off uses LARecomp's denoisers and is the default. DLSS Ray Reconstruction also requires DLSS upscaling. AMD FSR Ray Regeneration requires Direct3D 12."

[rows.PM_RxGpuFrameGen]
native = "kFrameGenerationDynamics"
help = "Frame generation: off, fsr31 (AMD FSR 3.1 frame generation, on any graphics card, with or without an upscaler) or dlss (NVIDIA DLSS frame generation through Streamline, on an RTX 40 or 50 series card: 2x, and 3x or 4x on an RTX 50 with mcla_gpu_frame_generation_multiplier; Streamline presents the frames, and on Vulkan it applies from the next start)."

[rows.PM_RxGpuFrameGenMult]
native = "kMultiplierDynamics"
help = "How many frames DLSS frame generation shows for each one the game renders (mcla_gpu_frame_generation = dlss): 2 makes one in between, 3 two, 4 three."

[rows.PM_RxGpuFrameGenFps]
native = "kFpsLimitValueDynamics"
help = "The frame rate cap while frame generation runs, in frames the game RENDERS a second (twice as many are shown): -1 is HALF DISPLAY, the default, the floor of 97% of half of the display's refresh rate (116 at 240 Hz, 58 at 120 Hz), which fills the display; it is only offered on a display of 100 Hz or more, and where it is not the cap you chose (fps_limit) applies."
value = { "-1" = { "label" = "USE FPS LIMIT" }, "0" = { "title" = "Unlimited" } }

