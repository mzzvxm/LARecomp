[rows.PM_RxCutPlay]
label = "PLAY CUTSCENE"
help = "Play the selected story cutscene."

[rows.PM_RxUiAccent]
help = "Replaces the blue/teal that every menu uses (selection bar, highlights, arrows) with this color, as RRGGBB hex."

[rows.PM_RxUiTitle]
help = "Replaces the yellow of the menu titles and the spinning globe, as RRGGBB hex."

[rows.PM_RxUiFrame]
help = "Replaces the gray of the menu frame, as RRGGBB hex."

[rows.PM_RxSpeedUnits]
help = "Speedometer / distance units."

[rows.PM_RxHudWidth]
native = "kHudWidthDynamics"
help = "On a wide picture, how far the HUD's corner pieces (the minimap, speedometer, race position, lap and time, and the phone) move out toward the screen edges, in percent: 0 (Centered) keeps the whole HUD in the middle 16:9, 50 (Wider) is halfway, 100 (Full) puts each piece as far from its edge as on a 16:9 screen."
value = { "0" = { "label" = "CENTERED" }, "50" = { "label" = "WIDER" }, "100" = { "label" = "FULL" } }

[rows.PM_RxGpuPreset]
help = "One choice for the four effect pages: image quality, lighting and shadows, reflections and world detail. Vanilla is the game as it shipped on the console. Enhanced adds the new effects at the settings that suit a mid-range card, Enhanced Ultra at the settings of a high-end one; the two RT presets also ray trace and need a graphics card that can. Display and upscaling are never changed. Changing a single effect afterwards switches this to Custom and keeps your values."

[rows.PM_RxSubVideo]
help = "Open the display settings."

[rows.PM_RxSubImageQuality]
help = "Open the image quality settings."

[rows.PM_RxSubLighting]
help = "Open the lighting and shadows settings."

[rows.PM_RxSubReflections]
help = "Open the reflections settings."

[rows.PM_RxSubWorldDetail]
help = "Open the world detail settings."

[rows.PM_RxSubCam]
help = "Open the camera settings."

[rows.PM_RxSubTod]
help = "Open the time of day settings."

[rows.PM_RxSubCarbon]
help = "Open the carbon fiber settings."

[rows.PM_RxSubDiff]
help = "Open the difficulty settings."

[rows.PM_RxSubMap]
help = "Open the map mouse settings."

[rows.PM_RxDiffPreset]
help = "Whose AI rules races use: complete = the Complete Edition's, as shipped; original = the launch build's (December 2008), before the title update that eased it: the AI keeps its nitrous closer to the finish, the home-stretch hold-back is shorter, and the career difficulty starts at 3 and climbs and falls within the launch limits."

[rows.PM_RxAiDiff]
native = "kAiDiffDynamics"
help = "AI difficulty in percent: 0 = easiest, 100 = the game's hardest, each 10% one RubberBandTune level."
value = { "-1" = { "label" = "STOCK" } }

[rows.PM_RxRbCatchup]
help = "Scales how hard the AI pulls when it is BEHIND: MaxThrottle, BehindMaxThrottle, HomeStretchBehindMaxThrottle, PlayerCloseMaxThrottle."

[rows.PM_RxRbHoldback]
help = "Scales MinThrottle, the throttle cap while the AI is AHEAD."

[rows.PM_RxRbDist]
help = "Scales the distance bands the rubberband reacts within: MinDist, MaxDist, BehindMinDist, BehindMaxDist."

[rows.PM_RxRbShortcut]
help = "Scales DistBehindBeforeTakingShortcuts: how far behind you the AI must fall before it takes a track's alternate (shortcut) path."

[rows.PM_RxRbNitroStart]
native = "kRbNitroStartDynamics"
help = "UseNitroMinDistFromStart in world units: how far into the race the AI must be before it may touch nitrous."
value = { "-1" = { "label" = "STOCK" } }

[rows.PM_RxRbNitroFin]
help = "Scales UseNitroMinDistFromFinish, the gate tied to the run-in to the finish."

[rows.PM_RxRbNitroBeh]
help = "Scales UseNitroMinDistBehindPlayer and UnlimitedNitroMinDistBehindPlayer — how far behind you the AI has to be before it spends nitrous, and before it gets unlimited."

[rows.PM_RxSubUi]
help = "Open the ui settings."

[rows.PM_RxSubLang]
help = "Open the languages settings."

[rows.PM_RxSubCut]
help = "Open the cutscenes settings."

[rows.PM_RxTexMods]
help = "Use the texture mods (<mods>/<Mod>/textures_replace/)."

[rows.PM_RxVinylLayers]
help = "Raise the front/rear BUMPER vinyl caps from 16 to 31 layers each (64/64/64/31/31)."

[rows.PM_RxBigSession]
apply_note = "The game reads this choice when you next host a session."
help = "Sessions of more than 8 players keep damage, debris, world props and the default session settings that MCLA turns off above 8."

[rows.PM_RxStartGarage]
apply_note = "The game places the car at the selected garage on the next start."
help = "Which district garage the car starts the session at: hollywood (what the game always does), beaches, sc, or last (the garage nearest the car when the game was closed)."

