[rows.PM_RxMapMouseMag]
help = "Leave the map's cursor magnet alone."

[rows.PM_RxTodReal]
help = "Follow your computer's clock: the world sits at the real local hour and keeps up with it."

[rows.PM_RxTodHold]
help = "Freeze the world at time_of_day instead of letting the day cycle run."

[rows.PM_RxTodHour]
help = "Hour to hold the world at (0-24, fractional), applied while time_of_day_hold is on."

[rows.PM_RxTodSpeed]
